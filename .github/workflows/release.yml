# GitHub Actions release pipeline for GzLevelUp
#
# Push a version tag to build a release-ready addon zip:
#
#     git tag 1.1
#     git push origin 1.1
#
# Two-part version tags only (e.g. 1.0, 1.1, 2.0); a leading "v" is allowed
# too (v1.1). The tag name is written into the addon's .toc (## Version:) and
# used to name the zip: GzLevelUp-1.1.zip
#
# The test suite runs first; a failing tag produces no release. The release
# body is taken from the matching CHANGELOG.md section.
#
# Outputs:
#   * a GitHub Release for the tag with the zip attached as an asset

name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  ADDON_NAME: GzLevelUp

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gate the release on the test suite: a tag must never ship a build that
      # does not pass. Same commands as .github/workflows/test.yml.
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4

      - name: Syntax check (strict)
        run: luac5.4 -p GzLevelUp/*.lua tests/*.lua

      - name: Run test suite
        run: lua5.1 tests/run.lua

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Packaging ${ADDON_NAME} ${VERSION}"
          python3 ci/build_package.py

      # Uses the CHANGELOG.md section for this version as the release body.
      # A missing section exits 1 but still prints a fallback line, and that
      # must not fail the release — hence the "|| true".
      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 ci/release_notes.py "$VERSION" > RELEASE_NOTES.md || true
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.ADDON_NAME }} ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.ADDON_NAME }}-${{ steps.version.outputs.version }}.zip
