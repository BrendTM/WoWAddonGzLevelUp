# Runs the GzLevelUp test suite on every push and pull request.
#
# The addon ships against WoW Classic, which embeds Lua 5.1, so the suite runs
# under lua5.1. The extra luac5.4 syntax check is a cheap lint: 5.4 rejects a
# few things 5.1 tolerates (e.g. assigning to a for-loop variable), and none of
# those are worth shipping.

name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4

      - name: Syntax check (strict)
        run: luac5.4 -p GzLevelUp/*.lua tests/*.lua

      - name: Run test suite
        run: lua5.1 tests/run.lua
